[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endurance-strategy"
version = "0.1.0"
description = "Pit strategy planning for WEC endurance races, built on real timing data."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pandera>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
